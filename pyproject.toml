[project]
name = "paco-alcater"
version = "0.1.0"
description = "Pac-Man arcade game"
requires-python = ">=3.10, < 3.14"

dependencies = [
    "flake8>=7.4.1",
    "mazegenerator",
    "mypy>=2.4.0",
    "pygame>=2.6.1",
    "pyinstaller>=6.22.3",
]

[tool.uv]
package = false

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-00001/mazegenerator-2.1.0-py3-none-any.whl" }
